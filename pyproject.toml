[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-credit-evidence"
version = "0.1.0"
description = "Credit decision evidence verification system for OpenCredit Evidence Hackathon (4-week plan: Credit Evidence Engine)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Team OpenCredit Evidence" },
]
keywords = ["credit", "evidence", "verification", "rag", "nemotron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "structlog>=23.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
oce = "open_credit_evidence.cli:app"

[project.urls]
Repository = "https://github.com/algoritmica/open-credit-evidence"

[tool.hatch.build.targets.wheel]
packages = ["src/open_credit_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "nvidia_http: mocked NVIDIA Build HTTP (no live network)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
