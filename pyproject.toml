[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-evidence-engine"
version = "0.1.0.dev0"
description = "Tests AI assistants that compile a case file for a human who makes a regulated decision, and produces the evidence to approve them."
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pymilvus[milvus_lite]>=2.4",
]

[project.scripts]
evidence = "evidence.cli:main"
sdd = "sdd.cli:app"  # the Synthetic Data Designer, vendored in src/sdd

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "opentimestamps>=0.4.5"]
# Anchoring a run's seal in Bitcoin through OpenTimestamps (evidence.anchor); optional.
anchor = ["opentimestamps>=0.4.5"]
# The Synthetic Data Designer (src/sdd) generates the test cases; the web UI serves it at /sdd/.
generate = ["numpy>=1.26", "scipy>=1.11", "duckdb>=0.10", "typer>=0.12", "openpyxl>=3.1",
            "scikit-learn>=1.3"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
       "credit-evidence-engine[generate,anchor]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidence.web" = ["static/*"]
"evidence.packs" = ["templates/*"]
"sdd" = ["LICENSE", "NOTICE", "VENDORED.md", "packs/*.yaml"]
"sdd.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/sdd"]  # vendored: the designer's own repository lints it

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
