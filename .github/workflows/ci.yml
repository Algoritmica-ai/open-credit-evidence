name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (no network)
        run: pytest -q
      - name: Verify every committed run re-derives
        run: |
          for run in runs/*/; do
            [ -f "$run/checksums.sha256" ] || continue
            evidence verify "$run" --recompute --pack packs/underwriter-sample
          done

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: credit-evidence-engine:ci
          load: true
      - name: Tests inside the image
        run: docker run --rm credit-evidence-engine:ci pytest -q
